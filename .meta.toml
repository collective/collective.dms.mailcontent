# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[gitignore]
extra_lines = """
# buildout local dev (Makefile)
.plone-version
.python-version
CACHEDIR.TAG
src/*
!src/collective
htmlcov/
*.log
output.xml
report.html
.plone.versioncheck.tracked.json
"""

[tox]
use_mxdev = true
test_matrix = {"6.2" = ["*"]}
test_environment_variables = """
    zope_i18n_compile_mo_files=true
    ROBOT_BROWSER=headlessfirefox
"""
test_deps_additional = """
    horse-with-no-namespace
    collective.compoundcriterion @ file://{toxinidir}/sources/collective.compoundcriterion
    collective.contact.core @ file://{toxinidir}/sources/collective.contact.core
    collective.dms.basecontent @ file://{toxinidir}/sources/collective.dms.basecontent
    collective.dms.scanbehavior @ file://{toxinidir}/sources/collective.dms.scanbehavior
    collective.eeafaceted.batchactions @ file://{toxinidir}/sources/collective.eeafaceted.batchactions
    collective.eeafaceted.collectionwidget @ file://{toxinidir}/sources/collective.eeafaceted.collectionwidget
    collective.eeafaceted.dashboard @ file://{toxinidir}/sources/collective.eeafaceted.dashboard
    collective.eeafaceted.z3ctable @ file://{toxinidir}/sources/collective.eeafaceted.z3ctable
    collective.externaleditor @ file://{toxinidir}/sources/collective.externaleditor
    collective.iconifiedcategory @ file://{toxinidir}/sources/collective.iconifiedcategory
    collective.js.tooltipster @ file://{toxinidir}/sources/collective.js.tooltipster
    eea.facetednavigation @ file://{toxinidir}/sources/eea.facetednavigation
    imio.actionspanel @ file://{toxinidir}/sources/imio.actionspanel
    imio.annex @ file://{toxinidir}/sources/imio.annex
    imio.dashboard @ file://{toxinidir}/sources/imio.dashboard
    imio.history @ file://{toxinidir}/sources/imio.history
    imio.migrator @ file://{toxinidir}/sources/imio.migrator
    imio.prettylink @ file://{toxinidir}/sources/imio.prettylink
    plone.formwidget.masterselect @ file://{toxinidir}/sources/plone.formwidget.masterselect
"""

[pyproject]
dependencies_mappings = [
    "'Products.ZCatalog' = ['Products.PluginIndexes', 'Products.ZCatalog']",
]
